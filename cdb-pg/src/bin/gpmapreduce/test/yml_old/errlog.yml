%YAML 1.1
---
VERSION:         1.0.0.1
DATABASE:        postgres
USER:            cwelton

DEFINE:

  - INPUT:
      NAME:      logs
      EXEC:      'ls /gpdata/gp*.log'
  
  - INPUT:
      NAME:      logs_from_config
      QUERY:     |
        SELECT hostname || ':' || datadir || '.log'
        FROM   gp_configuration
        WHERE  isprimary
              
  - MAP:
      NAME:      wordsplit_python
      FUNCTION:  |
        import nltk, email
        tokenizer = nltk.WordTokenizer()
        stemmer   = nltk.PorterStemmer()
        message   = email.message_from_file(open(value))
        text      = message.get_payload()
        result    = []
        for token in tokenizer.tokenize(text):
          stem = stemmer.stem(token.lower())
          yield([stem, 1])
      LANGUAGE:   python
      OPTIMIZE:   STRICT IMMUTABLE
      MODE:       MULTI
      PARAMETERS: value text
      RETURNS:
        - key text
        - value integer

  - MAP:
      NAME:      reverse_python
      FUNCTION:  |
        return (value, key)
      LANGUAGE:  python
      OPTIMIZE:   STRICT IMMUTABLE
      PARAMETERS:
        - key text
        - value integer
      RETURNS:
        - key integer
        - value text
      
  - TASK:
      NAME:      email_histogram
      SOURCE:    logs
      MAPPER:    wordsplit_python
      REDUCER:   SUM
        
EXECUTE:
  - RUN:
      SOURCE:    logs
