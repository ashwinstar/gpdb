%YAML 1.1
---  
VERSION:   1.0.0.1
DATABASE:  postgres
USER:      cwelton

DEFINE:
    - INPUT:
        NAME:      weblog
        FILE:
          - maple:/Users/cwelton/Desktop/GPMapReduce-0.9b/example/data/access_log
          - maple:/Users/cwelton/Desktop/GPMapReduce-0.9b/example/data/access_log2
        
    - MAP:
         NAME:     myMap
         LANGUAGE: perl
         FUNCTION:     |
           return {} unless ($_[1] =~ m/GET ([^ ?,]+)/);
           return {"key" => $1, "value" => 1}

    - TRANSITION:
         NAME:     myTransition
         LANGUAGE: perl
         FUNCTION: return $_[0] + $_[1];

    - REDUCER:
         NAME:       myReduce
         INITIALIZE: '0'
         TRANSITION: myTransition
         COMBINER:   myTransition

EXECUTE:
  - RUN:
     SOURCE:   weblog
     MAPPER:   myMap
     REDUCER:  myReduce
     TARGET:   STDOUT
