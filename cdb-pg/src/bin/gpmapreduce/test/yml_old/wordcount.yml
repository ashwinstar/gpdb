%YAML 1.1
---
VERSION:         1.0.0.1
DATABASE:        postgres
USER:            cwelton

DEFINE:
  - INPUT:
      NAME:      email
      FILE:      maple:/Users/cwelton/Desktop/enron/mailfiles.small

  - OUTPUT:      
      NAME:      counts
#      FILE:      /Users/cwelton/Desktop/mapred3/counts.txt
      DELIMITER: ','
      TABLE:     counts
      
  - MAP:
      NAME:      wordsplit_python
      FUNCTION:  |
        import nltk, email
        tokenizer = nltk.WordTokenizer()
        stemmer   = nltk.PorterStemmer()
        stopwords = nltk.corpus.stopwords.words()
        message   = email.message_from_file(open(value))
        text      = message.get_payload()
        result    = []
        for token in tokenizer.tokenize(text):
          token = token.lower()
          if token in stopwords or token.isdigit() or len(token) > 30:
            continue
          stem = stemmer.stem(token)
          yield([stem, 1])
      LANGUAGE:   python
      OPTIMIZE:   STRICT IMMUTABLE
      MODE:       MULTI
      PARAMETERS: value text
      RETURNS:
        - key text
        - value integer

  - MAP:
      NAME:      reverse_python
      FUNCTION:  |
        return (value, key)
      LANGUAGE:  python
      OPTIMIZE:   STRICT IMMUTABLE
      RETURNS:
        - key integer
        - value text
      
  - TASK:
      NAME:      email_histogram
      SOURCE:    email
      MAPPER:    wordsplit_python
      REDUCER:   SUM
        
EXECUTE:
  - RUN:
      SOURCE:    email_histogram
      MAPPER:    reverse_python
      TARGET:    counts
      