%YAML 1.1
---
VERSION:         1.0.0.1
DATABASE:        postgres
USER:            cwelton

DEFINE:
  - INPUT:
      NAME:      inDirectory
      FILE:
        - maple:/Users/cwelton/Desktop/GPMapReduce-0.9b/example/data/access_log
        - maple:/Users/cwelton/Desktop/GPMapReduce-0.9b/example/data/access_log2

  - MAP:
      NAME:      grep_map
      FUNCTION:  |
        return {"key" => $_[0], "value" => $_[1]} if ($_[1] =~/$_[0]/);
        return {};
      LANGUAGE:  perl
      OPTIMIZE:  STRICT IMMUTABLE
      
EXECUTE:
  - RUN:
      SOURCE:    inDirectory
      MAPPER:    grep_map
      REDUCER:   IDENTITY

