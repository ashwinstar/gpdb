%YAML 1.1
---
version:  1.0.0.1
database: cwelton
user:     cwelton
host:     Maple
port:     5432

execute:
  - run:
      source:   myinput

  - run:
      source:   myinput      
      mapper:   map

  - run:
      source:   myinput  
      reducer:  myreducer

  - run:
      source:   myinput
      mapper:   map
      reducer:  myreducer
      
define:
  - REDUCER:
      name:        myReducer
      initialize:  '0'
      transition:  myTransition
      combiner:    myCombiner
      finalizer:   myFinalizer

  - COMBINER:
      name:      myCombiner
      language:  perl
      function:  |
        return ['value: perlcode']

  - TRANSITION:
      name:      myTransition
      function:  |
        def buildtuple(key, value):
          return [key, value]
        return buildtuple('key: ', 'value: perlcode')
      language:  plpythonu
      mode:      SINGLE
      optimize:  UNORDERED STRICT

  - FINALIZER:
      NAME:     myFinalizer
      language: perl
      function: |
          return 'A nice value'
          
  - MAP:
      name:       Map
      language:   perl
      function:   |
        ($key, $value) = @_;
        return {key => $value, value => $key}
      parameters: [key text, value integer]
      returns:    [key integer, value text]

  - INPUT:
      name:    myInput
      file:    Maple:/Users/cwelton/Desktop/mapred3/myfile.txt
      columns: [key text, value integer]
      delimiter: '|'

